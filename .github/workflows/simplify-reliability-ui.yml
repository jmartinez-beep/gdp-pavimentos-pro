name: Simplificar interfaz de confiabilidad

on:
  push:
    branches: [main]
    paths:
      - 'tools/simplify_reliability_ui.py'
      - '.github/workflows/simplify-reliability-ui.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar simplificación
        run: python tools/simplify_reliability_ui.py
      - name: Verificar sintaxis
        run: python -m py_compile app.py
      - name: Verificar interfaz
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('app.py').read_text(encoding='utf-8')
          assert 'Índice de confiabilidad (%)' in t
          assert 'Error estándar global (control)' not in t
          assert 'Serviciabilidad inicial' not in t
          assert 'Serviciabilidad terminal' not in t
          assert 'overall_standard_error' in t
          assert 'initial_serviceability' in t
          assert 'terminal_serviceability' in t
          print('Interfaz simplificada y parámetros internos conservados.')
          PY
      - name: Guardar app.py actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes."
          else
            git commit -m "Simplificar interfaz del índice de confiabilidad"
            git push
          fi
