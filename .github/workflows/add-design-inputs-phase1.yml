name: Integrar datos prioritarios de diseño fase 1

on:
  push:
    branches:
      - main
    paths:
      - 'tools/add_design_inputs_phase1.py'
      - '.github/workflows/add-design-inputs-phase1.yml'

permissions:
  contents: write

jobs:
  update-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar fase 1 de datos de diseño
        run: python tools/add_design_inputs_phase1.py
      - name: Verificar sintaxis
        run: python -m py_compile app.py
      - name: Verificar integración funcional
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          required = [
              '# DESIGN_DATA_PHASE1',
              'Geometría y configuración funcional del tramo',
              'Caracterización geotécnica complementaria',
              'Propiedades de materiales para la evaluación Tomo I',
              'Confiabilidad y criterios de control',
              'project_geometry',
              'subgrade_details',
              'design_materials',
              'design_reliability',
              'sheet_name="Geometria"',
              'sheet_name="Materiales"',
              'sheet_name="Confiabilidad"',
          ]
          for item in required:
              assert item in text, item
          print('Fase 1 de datos de diseño integrada correctamente.')
          PY
      - name: Guardar app.py actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes."
          else
            git commit -m "Integrar datos prioritarios de diseño fase 1"
            git push
          fi
