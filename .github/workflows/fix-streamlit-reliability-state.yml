name: Corregir estado de confiabilidad Streamlit

on:
  push:
    branches:
      - main
    paths:
      - 'tools/fix_streamlit_reliability_state.py'
      - '.github/workflows/fix-streamlit-reliability-state.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar corrección
        run: python tools/fix_streamlit_reliability_state.py
      - name: Verificar sintaxis
        run: python -m py_compile app.py
      - name: Verificar colisión resuelta
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          assert 'key="design_reliability_pct"' in text
          assert 'st.session_state.design_reliability = {' in text
          bad = 'key="design_reliability")'
          assert bad not in text
          print('Colisión de clave Streamlit corregida y verificada.')
          PY
      - name: Guardar app.py actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes."
          else
            git commit -m "Corregir colision de estado de confiabilidad"
            git push
          fi
