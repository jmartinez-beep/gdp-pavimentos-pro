name: Validar Tomo II GDP-2024

on:
  push:
    branches:
      - agent/tomo2-gdp-2024-trazabilidad
  pull_request:
    paths:
      - 'gdp_tomo2.py'
      - 'pages/06_Tomo_II_GDP_2024.py'
      - 'tests/test_gdp_tomo2.py'
      - '.github/workflows/validate-tomo2.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias mínimas
        run: |
          python -m pip install --upgrade pip
          pip install pandas pytest streamlit
      - name: Verificar sintaxis
        run: |
          python -m py_compile gdp_tomo2.py pages/06_Tomo_II_GDP_2024.py
      - name: Ejecutar pruebas Tomo II
        run: pytest -q tests/test_gdp_tomo2.py
