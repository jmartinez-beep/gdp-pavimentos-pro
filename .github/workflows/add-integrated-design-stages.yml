name: Integrar etapas de diseño 2 5 9 10 11 12 13 18

on:
  push:
    branches: [main]
    paths:
      - 'tools/add_integrated_design_stages_2_5_9_10_11_12_13_18.py'
      - '.github/workflows/add-integrated-design-stages.yml'

permissions:
  contents: write

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar etapas integradas
        run: python tools/add_integrated_design_stages_2_5_9_10_11_12_13_18.py
      - name: Verificar sintaxis
        run: python -m py_compile app.py
      - name: Verificar integración funcional
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          required = [
              'def configurable_transfer_damage',
              'Vínculo clima – módulo dinámico E*',
              'Segmentación preliminar en tramos homogéneos',
              'Confiabilidad aplicada al resultado',
              'Diseño iterativo automático — candidatos de cribado',
              'jerarquía obligatoria **cumplimiento técnico',
              'Diagnóstico del pavimento existente — rehabilitación',
              'Estado profesional del expediente',
              'Transferencia', 'Rehabilitacion', 'Optimizacion'
          ]
          for item in required:
              assert item in text, item
          assert 'python -m py_compile' not in text
          print('Etapas integradas presentes y sintaxis válida.')
          PY
      - name: Guardar app.py actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes."
          else
            git commit -m "Integrar etapas 2 5 9 10 11 12 13 y 18"
            git push
          fi
