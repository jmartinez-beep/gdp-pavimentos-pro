name: Integrar visor 3D v2

on:
  push:
    branches: [agent/visor-3d-v2]
    paths:
      - tools/integrate_3d_v2.py
      - .github/workflows/integrate-3d-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/visor-3d-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aplicar integración 3D v2
        run: python tools/integrate_3d_v2.py

      - name: Verificar sintaxis
        run: python -m py_compile app.py

      - name: Verificar contrato visual 3D v2
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          required = [
              'Visor estructural 3D v2',
              'Escala vertical',
              'Corte transversal',
              'Corte longitudinal',
              'medio semiinfinito',
              'Comparar alternativas en 3D',
              'Isométrica',
              'Restablecer',
              '_structure_layers_3d',
              '_top_surface_z_3d',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'Faltan elementos 3D v2: {missing}')
          if '25.0 + subbase_cm + base_cm + asphalt_cm' in text:
              raise SystemExit('Persistió el espesor visual antiguo de subrasante en patologías')
          print('Contrato 3D v2 verificado')
          PY

      - name: Guardar app.py integrado
        run: |
          if git diff --quiet -- app.py; then
            echo "app.py ya estaba integrado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Integrar visor estructural 3D v2"
          git push
