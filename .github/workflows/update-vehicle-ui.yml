name: Actualizar interfaz vehicular

on:
  push:
    branches:
      - agent/mejorar-composicion-vehicular
  pull_request:
    paths:
      - 'app.py'
      - 'tools/improve_vehicle_inputs.py'
      - '.github/workflows/update-vehicle-ui.yml'

permissions:
  contents: write

jobs:
  update-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Aplicar corrección de interfaz vehicular
        if: github.event_name == 'push'
        run: python tools/improve_vehicle_inputs.py
      - name: Verificar sintaxis
        run: python -m py_compile app.py
      - name: Verificar contrato de datos
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          required = [
              'Cantidad diaria (veh/día)',
              'Factor camión',
              'vehicles = edited_vehicles.rename',
              '["Categoría", "Factor camión", "TPD"]',
              'weighted_daily = float((vehicles["TPD"] * vehicles["Factor camión"]).sum())',
          ]
          for item in required:
              assert item in text, item
          assert 'cols = st.columns(3)' not in text[text.index('with p2:'):text.index('with p3:')]
          print('Contrato vehicular verificado.')
          PY
      - name: Guardar app.py actualizado
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes."
          else
            git commit -m "Mejorar composición vehicular"
            git push
          fi
