name: Integrar categorías Tomo I

on:
  push:
    branches:
      - main
    paths:
      - 'tools/add_tomo1_categories.py'
      - '.github/workflows/add-tomo1-categories.yml'

permissions:
  contents: write

jobs:
  update-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar categorías Tomo I
        run: python tools/add_tomo1_categories.py
      - name: Verificar sintaxis
        run: python -m py_compile app.py
      - name: Verificar clasificación GDP-2024 Tomo I
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          required = [
              'def tomo1_design_category(esal: float) -> int:',
              'if esal < 3_000_000:',
              'if esal <= 25_000_000:',
              'Clasificación automática Tomo I: Categoría',
              'Tabla 102-01',
              'design_category": tomo1_category',
              'Categoría de diseño Tomo I',
          ]
          for item in required:
              assert item in text, item
          print('Categorías Tomo I verificadas.')
          PY
      - name: Guardar app.py actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes."
          else
            git commit -m "Integrar categorías automáticas Tomo I por ESAL"
            git push
          fi
