name: Corregir idempotencia Tomo II

on:
  push:
    branches:
      - agent/fix-tomo2-idempotencia
  pull_request:
    paths:
      - 'app.py'
      - 'tools/integrate_tomo2_app.py'
      - 'tools/fix_tomo2_idempotencia.py'
      - '.github/workflows/fix-tomo2-idempotencia.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pytest streamlit plotly reportlab openpyxl ezdxf
      - name: Limpiar import y corregir parche
        run: python tools/fix_tomo2_idempotencia.py
      - name: Probar idempotencia del parche
        run: |
          python tools/integrate_tomo2_app.py
          python tools/integrate_tomo2_app.py
          test "$(grep -c '^from gdp_tomo2_adapter import alternatives_for_app, selected_trace$' app.py)" -eq 1
      - name: Verificar sintaxis y pruebas
        run: |
          python -m py_compile app.py gdp_tomo2.py gdp_tomo2_adapter.py
          python -m pytest -q tests/test_gdp_tomo2.py tests/test_gdp_tomo2_adapter.py
      - name: Guardar corrección
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py tools/integrate_tomo2_app.py
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes."
          else
            git commit -m "Corregir idempotencia de integración Tomo II"
            git push
          fi
