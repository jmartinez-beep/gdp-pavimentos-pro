name: Integrar clima por estación o valores mensuales

on:
  push:
    branches:
      - agent/clima-estacion-mensual
  pull_request:
    paths:
      - 'app.py'
      - 'climate_tools.py'
      - 'tools/integrate_climate_monthly.py'
      - 'tests/test_climate_tools.py'
      - '.github/workflows/integrate-climate-monthly.yml'

permissions:
  contents: write

jobs:
  update-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Aplicar integración climática
        if: github.event_name == 'push'
        run: python tools/integrate_climate_monthly.py
      - name: Verificar sintaxis
        run: python -m py_compile app.py climate_tools.py
      - name: Probar utilidades climáticas
        run: python -m pytest -q tests/test_climate_tools.py
      - name: Verificar contrato de interfaz
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          required = [
              'Estación documentada',
              'Valores mensuales',
              'Periodo documentado',
              'climate_monthly_editor',
              'Clima_mensual',
              'monthly_air_c',
              'monthly_table',
              'Trazabilidad climática',
          ]
          for item in required:
              assert item in text, item
          print('Contrato climático estación/mensual verificado.')
          PY
      - name: Guardar app.py actualizado
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes."
          else
            git commit -m "Integrar clima por estación o meses"
            git push
          fi
