name: Visibilizar cuenta y proyectos

on:
  push:
    branches:
      - agent/visibilizar-proyectos
  pull_request:
    paths:
      - 'app.py'
      - 'project_state.py'
      - 'tests/test_project_state.py'
      - 'tools/visible_project_access.py'
      - '.github/workflows/visible-project-access.yml'

permissions:
  contents: write

jobs:
  update-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Aplicar mejora de acceso a proyectos
        if: github.event_name == 'push'
        run: python tools/visible_project_access.py
      - name: Verificar sintaxis
        run: python -m py_compile app.py web_storage.py project_state.py
      - name: Probar restauración segura del proyecto
        run: python -m pytest -q tests/test_project_state.py
      - name: Verificar controles visibles
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          required = [
              'initial_sidebar_state="expanded"',
              '### 👤 Cuenta y proyectos',
              '💾 Guardar proyecto ahora',
              '🔐 Iniciar sesión / Crear cuenta',
              '📂 Mis proyectos guardados',
              'Buscar por nombre',
              '📂 Abrir proyecto',
              'Confirmar eliminación',
              'save_project(int(user["id"]), project_name_main.strip(), state_to_save)',
              '_active_project_name',
              '_autosave_hash',
          ]
          for item in required:
              assert item in text, item
          print('Controles de cuenta y proyectos verificados.')
          PY
      - name: Guardar app.py actualizado
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes."
          else
            git commit -m "Visibilizar cuenta y proyectos"
            git push
          fi
