name: Mostrar factor G

on:
  push:
    branches:
      - agent/mostrar-factor-g
  pull_request:
    paths:
      - 'app.py'
      - 'tools/show_growth_factor_g.py'
      - '.github/workflows/show-growth-factor-g.yml'

permissions:
  contents: write

jobs:
  update-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Aplicar mejora del factor G
        run: python tools/show_growth_factor_g.py
      - name: Verificar sintaxis
        run: python -m py_compile app.py
      - name: Verificar presencia y exportación del factor G
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          required = [
              'Factor de crecimiento G',
              'growth_factor": gf',
              "traffic.get('growth_factor', 0)",
              'G=\\frac{(1+r)^Y-1}{r}',
              'Factor G: {gf:.3f}',
          ]
          for item in required:
              assert item in text, item
          print('Factor G visible y exportable verificado.')
          PY
      - name: Guardar app.py actualizado
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes."
          else
            git commit -m "Mostrar factor de crecimiento G"
            git push
          fi
